# ============================================================
# 🚀 SandeepCloud Portfolio — Enhanced CI/CD Pipeline
# ============================================================
# GATES:
#   1. Lint        → ESLint checks code quality
#   2. Audit       → npm audit checks shipped (non-dev) packages
#   3. Secrets     → Gitleaks scans for exposed credentials
#   4. Test        → Vitest runs unit tests
#   5. Build+Push  → Build image, Trivy scan (report-only), push to Docker Hub
#   6. Deploy      → Watchtower auto-detects (no action needed)
# ============================================================

name: 🚀 Portfolio CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch: {}

# Default-deny: every job gets read-only access to the repo and nothing else.
# Jobs needing more must opt in explicitly (see secrets-scan below).
permissions:
  contents: read

jobs:
  # ================================================================
  # JOB 1: CODE QUALITY — Lint with ESLint
  # ================================================================
  lint:
    name: 🔍 Code Quality (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

  # ================================================================
  # JOB 2: DEPENDENCY AUDIT — Check for vulnerable packages
  # ================================================================
  audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Production dependencies only. Build tools (Vite, Tailwind, PostCSS)
      # are devDependencies: they run in CI and the Docker build stage but
      # never reach the Nginx bundle or the Vercel function.
      - name: 🔍 Run npm audit
        run: npm audit --omit=dev

  # ================================================================
  # JOB 3: SECRET SCANNING — Detect exposed credentials
  # ================================================================
  secrets-scan:
    name: 🔐 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    # Gitleaks posts its findings as a PR comment, which needs write access
    # to pull requests. Scoped to this job only.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 🔐 Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # JOB 4: TESTS — Run unit tests
  # ================================================================
  test:
    name: 🧪 Run Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ================================================================
  # JOB 5: BUILD & PUSH — Docker image to Docker Hub
  # ================================================================
  build-and-push:
    name: 🐳 Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: ['lint', 'audit', 'secrets-scan', 'test']

    # Only push on main branch (not on pull requests)
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    # Uploading Trivy SARIF to the Security tab needs security-events: write.
    permissions:
      contents: read
      security-events: write

    env:
      IMAGE: pokharelsandeep333/my-portfolio-app
      # Trivy v0.76.1, pinned by digest (identical on Docker Hub, GHCR and ECR Public).
      # Do NOT replace with aquasecurity/trivy-action or setup-trivy: their tags were
      # hijacked in the March 2026 supply-chain attack.
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      # ── Scan gate ─────────────────────────────────────────────────────────
      # '0' = REPORT-ONLY (current): findings are logged and uploaded, the push still happens.
      # '1' = BLOCKING: any fixable CRITICAL/HIGH fails the job and the image is NOT pushed.
      # Flip to '1' once the current findings are fixed.
      TRIVY_GATE_EXIT_CODE: '0'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build into the local Docker daemon only. Nothing reaches Docker Hub
      # (and so Watchtower) until the scan below has run.
      - name: 🐳 Build Docker Image (local, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            pokharelsandeep333/my-portfolio-app:latest
            pokharelsandeep333/my-portfolio-app:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_FORMSPREE_URL=${{ secrets.VITE_FORMSPREE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy reads the image from a tarball, so the Docker socket is never mounted.
      - name: 📦 Export image for scanning
        run: docker save "$IMAGE:$GITHUB_SHA" -o image.tar

      # The vuln DB is ~1.6 GB unpacked. Keyed per day; restore-keys falls back to the
      # newest older copy and Trivy refreshes it if stale.
      - name: 📅 Trivy DB cache key
        id: trivy-db-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/db
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-db-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Runs as the runner's uid so the cache files stay readable for actions/cache
      # (as root, Trivy leaves root-owned 0700 dirs behind). Always exits 0: the SARIF
      # must be produced even when the gate below blocks.
      - name: 🛡️ Trivy scan (SARIF)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" "$TRIVY_IMAGE" \
            image --scanners vuln --input /w/image.tar --severity CRITICAL,HIGH --ignore-unfixed \
            --cache-dir /w/.trivy-cache --exit-code 0 --format sarif --output /w/trivy.sarif

      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image-build

      # Human-readable table in the log, and the gate: exits with TRIVY_GATE_EXIT_CODE
      # when fixable CRITICAL/HIGH findings exist. In blocking mode a failure here
      # skips the push step below.
      - name: 🚦 Trivy scan gate (table)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" "$TRIVY_IMAGE" \
            image --scanners vuln --input /w/image.tar --severity CRITICAL,HIGH --ignore-unfixed \
            --cache-dir /w/.trivy-cache --skip-db-update \
            --exit-code "$TRIVY_GATE_EXIT_CODE" --format table

      # Pushes the exact image that was scanned (no rebuild). SHA tag first, then
      # :latest, which is the tag Watchtower deploys.
      - name: 🚀 Push Docker Image to Docker Hub
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: 📋 Deployment Summary
        run: |
          echo "============================================="
          echo "✅ All quality gates passed!"
          echo "✅ Image pushed to Docker Hub!"
          echo "   Image: pokharelsandeep333/my-portfolio-app:latest"
          echo "   Commit: ${{ github.sha }}"
          echo ""
          echo "⏳ Watchtower will auto-deploy within ~5 minutes"
          echo "============================================="
