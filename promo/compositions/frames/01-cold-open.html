    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var ID = "01-cold-open";
        var DURATION = 3;
        var FPS = 30;
        var host = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (cls) {
          return Array.prototype.slice.call(host.getElementsByClassName(ID + "-" + cls));
        };

        // ---- seeded PRNG (mulberry32, seed 20260927); draws happen once, in fixed order ----
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rand = mulberry32(20260927);

        var tex = q("grain-tex")[0];
        var glowPath = q("power-glow")[0];
        var corePath = q("power-core")[0];
        var nameWrap = q("name")[0];
        var lines = q("line");
        var chunks = q("k");

        var tl = gsap.timeline({ paused: true });

        // ================= Scene 1 (0.0-0.8s): static ground + power line draw =================

        // Grain boil: seeded texture offsets stepped at 12 fps (texture shift, not a flash).
        var BOIL_STEP = 1 / 12;
        for (var s = 0; s * BOIL_STEP < DURATION; s += 1) {
          tl.set(
            tex,
            { x: Math.round((rand() - 0.5) * 360), y: Math.round((rand() - 0.5) * 360) },
            s * BOIL_STEP
          );
        }

        // Static flashes: 3 total, never more than 2 inside any 1 s window, grain only (no white).
        function staticFlash(t, peak) {
          tl.to(tex, { opacity: peak, duration: 1 / FPS, ease: "none" }, t);
          tl.to(tex, { opacity: 0.16, duration: 0.14, ease: "power2.out" }, t + 1 / FPS);
        }
        staticFlash(0.1, 0.4);
        staticFlash(0.8, 0.32);

        // svg-path-draw: dasharray = measured length, offset length -> 0, top to bottom.
        var len = 440;
        try {
          len = corePath.getTotalLength() || 440;
        } catch (e) {
          len = 440;
        }
        [corePath, glowPath].forEach(function (p) {
          p.style.strokeDasharray = String(len);
        });
        tl.fromTo(
          [corePath, glowPath],
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
          0.08
        );

        // ================= Scene 2 (0.8-2.0s): hacker-flip-3d decode, lock + zap =================

        var GLYPHS = "ABCDEFGHKNOPRSTUXYZ0123456789#$%&?";
        var FLIP = 0.7; // FLIP_DURATION
        var STAGGER = 0.05; // CHAR_STAGGER
        var LOCK_AFTER = 0.26; // raw time where power2.out progress crosses REVEAL_THRESHOLD 0.6
        var SWAP = 3 / FPS; // one glyph per 3 frames (FLICKER_RATE)
        var WORD_START = [0.8, 1.29]; // "Sandeep", then "Pokharel"; last char locks at 1.90

        function pickGlyph(target) {
          var g = GLYPHS.charAt(Math.floor(rand() * GLYPHS.length));
          if (g.toUpperCase() === target.toUpperCase()) {
            g = GLYPHS.charAt((GLYPHS.indexOf(g) + 1) % GLYPHS.length);
          }
          return g;
        }

        var T_LOCK = 0;
        lines.forEach(function (line, w) {
          var word = line.getAttribute("data-word");
          Array.prototype.forEach.call(word, function (ch, i) {
            var c = document.createElement("span");
            c.className = ID + "-c";
            // The two name lines are set with tight leading (0.92, as on the site), so
            // "Sandeep"'s glyph boxes touch "Pokharel"'s: intentional (layout audit opt-out).
            c.setAttribute("data-layout-allow-overlap", "");
            var real = document.createElement("span");
            real.setAttribute("data-layout-allow-overlap", "");
            real.textContent = ch; // reserves the real advance width (ghost) and is the final text
            c.appendChild(real);
            line.appendChild(c);

            var start = WORD_START[w] + i * STAGGER;
            var lockAt = start + LOCK_AFTER;
            T_LOCK = Math.max(T_LOCK, lockAt);

            // flap hinge at the bottom edge: rotateX 90 -> 0 under parent perspective
            tl.fromTo(
              c,
              { rotationX: 90 },
              { rotationX: 0, duration: FLIP, ease: "power2.out" },
              start
            );
            tl.fromTo(
              c,
              { opacity: 0 },
              { opacity: 1, duration: FLIP * 0.4, ease: "power2.out" },
              start
            );

            // seeded glyph flicker until the threshold, then the real letter clicks in
            var first = pickGlyph(ch);
            c.setAttribute("data-g", first);
            for (var k = 1; start + k * SWAP < lockAt - 0.001; k += 1) {
              tl.set(c, { attr: { "data-g": pickGlyph(ch) } }, start + k * SWAP);
            }
            tl.set(c, { attr: { "data-g": "" } }, lockAt);
            tl.fromTo(real, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, ease: "none" }, lockAt);
          });
        });

        // Zap on the lock (T_LOCK = 1.90, the glitch-1 SFX offset): glow bloom, line surge,
        // static flash, 3-frame seeded shake and an expo.out punch.
        staticFlash(T_LOCK, 0.44);
        tl.fromTo(
          nameWrap,
          { textShadow: "0px 0px 0px rgba(255,199,44,0)" },
          {
            textShadow: "0px 0px 44px rgba(255,199,44,0.85)",
            duration: 1 / FPS,
            ease: "none",
            immediateRender: false,
          },
          T_LOCK
        );
        tl.to(
          nameWrap,
          { textShadow: "0px 0px 0px rgba(255,199,44,0)", duration: 0.6, ease: "power2.out" },
          T_LOCK + 1 / FPS
        );
        tl.fromTo(
          glowPath,
          { opacity: 0.6 },
          { opacity: 1, duration: 1 / FPS, ease: "none", immediateRender: false },
          T_LOCK
        );
        tl.to(glowPath, { opacity: 0.6, duration: 0.5, ease: "power2.out" }, T_LOCK + 1 / FPS);
        tl.fromTo(
          nameWrap,
          { scale: 1.025 },
          { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false },
          T_LOCK
        );
        for (var j = 0; j < 3; j += 1) {
          tl.set(
            nameWrap,
            { x: Math.round((rand() - 0.5) * 12), y: Math.round((rand() - 0.5) * 4) },
            T_LOCK + j / FPS
          );
        }
        tl.set(nameWrap, { x: 0, y: 0 }, T_LOCK + 3 / FPS);

        // ================= Scene 3 (2.0-3.0s): discrete type-on of the subtitle, then hold =================
        // Word-sized bulk states (discrete-text-sequence), with a short beat after the title.
        var TYPE_AT = [2.0, 2.06, 2.12, 2.18, 2.27, 2.32, 2.36, 2.42, 2.48];
        chunks.forEach(function (el, i) {
          tl.fromTo(
            el,
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.001, ease: "none" },
            TYPE_AT[i]
          );
        });

        // Hold still to the cut; pin the timeline length to the frame duration.
        tl.set({}, {}, DURATION);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
