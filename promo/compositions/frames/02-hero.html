    <!-- track 2: callout pill (scramble-reveal) -->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var camera = document.getElementById("02-hero-camera");
        var zoomOuter = document.getElementById("02-hero-zoom-outer");
        var zoomInner = document.getElementById("02-hero-zoom-inner");
        var pill = document.getElementById("02-hero-callout");
        var live = document.getElementById("02-hero-callout-live");

        var DURATION = 4.2; // slot after beat-snap (was 4)
        var FPS = 30;

        // ---- Scene 1 (0.0-1.0s): window rises into its fixed slot ----------
        // multi-phase-camera, entrance phase only: approach (0.94) -> settle (1.0).
        // Lands exactly on the handoff state (x 48, y 262, scale 1, opacity 1).
        var RISE_AT = 0;
        var RISE_DUR = 1.0;

        // ---- Scene 2 (1.0-3.2s): slow push toward the portrait -------------
        // coordinate-target-zoom, nested wrappers. Portrait face sits ~69% / 51%
        // of the 984x615 viewport (offset +187, +8 px from centre). A full
        // T = -offset would expose empty viewport at 1.08x (cover budget
        // W*(S-1)/(2S) = 36 px x, 22 px y), and any leftward x shift crops the
        // real "Sandeep Pokharel" name at the viewport's left edge (it sits at
        // x 44; a centred 1.08x push already brings it to x 8). So x stays 0 and
        // the aim is vertical only (T_y = -offset_y): the portrait swells toward
        // the viewer while the name stays whole.
        var ZOOM_AT = 1.0;
        var ZOOM_DUR = 2.2;
        var ZOOM_SCALE = 1.08;
        var COUNTER_X = 0;
        var COUNTER_Y = -8;

        // ---- Callout at 1.2s: scramble-reveal (slide from left, L->R lock) ---
        var CALLOUT_AT = 1.2;
        var ARRIVAL = 0.45;
        var REVEAL = 0.4; // spec: 0.4 s scramble-to-text (was 1.2)
        var TARGET = pill.getAttribute("data-text");

        // Seeded PRNG — mulberry32, seed 20260927 (no Math.random).
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rand = mulberry32(20260927);

        // Frame table built once, synchronously; case-matched glyphs keep the
        // pill width close to the final string while scrambling.
        var frameTable = (function () {
          var lower = "abcdeghknopqrsuvxyz#%&";
          var upper = "ABCDEGHKNOPRSUVXYZ#%&";
          var chars = Array.from(TARGET);
          var lastFrame = Math.max(1, Math.round(REVEAL * FPS));
          var firstLock = Math.round(0.2 * FPS);
          var lockFrames = chars.map(function (ch, i) {
            if (/\s/.test(ch)) return 0;
            var pos = chars.length <= 1 ? 1 : i / (chars.length - 1);
            return Math.round(firstLock + pos * (lastFrame - firstLock));
          });
          var rows = [];
          for (var f = 0; f <= lastFrame; f += 1) {
            rows.push(
              chars
                .map(function (ch, i) {
                  if (/\s/.test(ch) || f >= lockFrames[i]) return ch;
                  var set = ch === ch.toUpperCase() && ch !== ch.toLowerCase() ? upper : lower;
                  var g = set.charAt(Math.floor(rand() * set.length));
                  if (g === ch) g = set.charAt((set.indexOf(g) + 1) % set.length);
                  return g;
                })
                .join(""),
            );
          }
          rows[rows.length - 1] = TARGET;
          return rows;
        })();

        var tl = gsap.timeline({ paused: true });

        // Scene 1 — rise (power3.out) + settle scale; opacity resolves early so
        // the hero is readable by 0.5s.
        // Stable pre-roll baseline for both fromTo calls below
        // (lint: gsap_repeated_fromto_without_baseline).
        tl.set(camera, { y: 360, scale: 0.94 }, 0);
        tl.fromTo(
          camera,
          { y: 360, scale: 0.94 },
          { y: 0, scale: 1, duration: RISE_DUR, ease: "power3.out" },
          RISE_AT,
        );
        tl.fromTo(
          camera,
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power2.out" },
          RISE_AT,
        );

        // Scene 2 — push: scale and counter-translate share position, duration, ease.
        tl.fromTo(
          zoomOuter,
          { scale: 1 },
          { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power2.inOut" },
          ZOOM_AT,
        );
        tl.fromTo(
          zoomInner,
          { x: 0, y: 0 },
          { x: COUNTER_X, y: COUNTER_Y, duration: ZOOM_DUR, ease: "power2.inOut" },
          ZOOM_AT,
        );

        // Callout — slides in from the left, text locks left to right.
        tl.fromTo(
          pill,
          { x: -60, opacity: 0 },
          { x: 0, opacity: 1, duration: ARRIVAL, ease: "power3.out" },
          CALLOUT_AT,
        );
        frameTable.forEach(function (row, f) {
          tl.set(live, { textContent: row }, CALLOUT_AT + f / FPS);
        });

        // Scene 3 (3.2-4.0s): everything settled; window static at handoff.
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-hero"] = tl;
      })();
    </script>
