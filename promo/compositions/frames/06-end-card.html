      var lineR = q(".e06-line-r");

      // Seeded PRNG — mulberry32, seed 20260927. No Math.random anywhere.
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(20260927);
      function span(lo, hi) {
        return lo + (hi - lo) * rand();
      }

      // svg-path-draw: dash = measured length; offset = length (hidden) -> 0 (drawn)
      // Measured once at build time; the tweens take these constants so every
      // render worker starts from the same value (lint: gsap_function_value_hazard).
      var LEN_L = lineL.getTotalLength();
      var LEN_R = lineR.getTotalLength();
      [[lineL, LEN_L], [lineR, LEN_R]].forEach(function (pair) {
        pair[0].style.strokeDasharray = String(pair[1]);
        pair[0].style.strokeDashoffset = String(pair[1]);

      var tl = gsap.timeline({ paused: true });

      var GLITCH_END = 0.3;
      var STEP = 0.05;
      var DRAW_START = 0.35;
      var DRAW_DUR = 0.6;
      var URL_START = DRAW_START + DRAW_DUR + 0.05; // 1.0
      var URL_DUR = 0.6; // lands 1.6
