    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var root = document.querySelector('[data-composition-id="04-chat"]');
        function byId(id) {
          return root.querySelector('[id="' + id + '"]');
        }

        var pageProjects = byId("04-chat-page-projects");
        var pageOpen = byId("04-chat-page-open");
        var slider = byId("04-chat-slider");
        var dim = byId("04-chat-dim");
        var panel = byId("04-chat-panel");
        var pill = byId("04-chat-callout");
        var live = byId("04-chat-callout-live");
        var clears = root.querySelectorAll('[data-chat-layer="clear"]');
        var qLayers = root.querySelectorAll('[data-chat-layer="q"]');
        var aLayers = root.querySelectorAll('[data-chat-layer="a"]');

        // ---- measured geometry (canvas px) ----
        // Opening the drawer glides the page 160 CSS px left and 40 CSS px down
        // (measured on the captures: the Projects heading moves 320/80 image px).
        var DX = -109.333;
        var DY = 27.333;
        var SLOT_W = 218.667;
        // Panel resting over its source region in the window (CSS x 1120, y 180
        // -> canvas x 813.33, y 425; 218.67 / 519 = 0.421323 uniform scale).
        var PANEL_AT_SLOT = { x: 533.333, y: 160, scale: 0.421323 };
        var RING_OFF = "0px 0px 0px 1.3px rgba(255,199,44,0), 0px 0px 0px 0px rgba(0,0,0,0)";
        var RING_ON = "0px 0px 0px 1.3px rgba(255,199,44,0.45), 0px 32px 86px 0px rgba(0,0,0,0.7)";

        // Clip insets in drawer image px (sheet 640 x 1800).
        // Question bubble band: y 380-505. Answer bubble groups end at y 884,
        // 1084, 1286 (between measured text rows), then the rest of the drawer.
        function qClip(right) {
          return "inset(380px " + right + "px 1295px 0px)";
        }
        function aClip(bottomY) {
          return "inset(505px 0px " + (1800 - bottomY) + "px 0px)";
        }

        // ---- explicit t=0 state ----
        gsap.set(pageProjects, { x: 0, y: 0, opacity: 1 });
        gsap.set(pageOpen, { x: -DX, y: -DY, opacity: 0 });
        gsap.set(slider, { x: SLOT_W });
        gsap.set(dim, { opacity: 0 });
        gsap.set(panel, {
          x: PANEL_AT_SLOT.x,
          y: PANEL_AT_SLOT.y,
          scale: PANEL_AT_SLOT.scale,
          transformOrigin: "0 0",
          opacity: 0,
          borderRadius: 0,
          boxShadow: RING_OFF,
        });
        gsap.set(clears, { opacity: 0 });
        gsap.set(qLayers, { clipPath: qClip(640) });
        gsap.set(aLayers, { clipPath: aClip(505) });
        gsap.set(pill, { opacity: 0, x: -43.2 });

        // ---- callout scramble table (seeded mulberry32 20260927, built once) ----
        var FINAL = pill.getAttribute("data-text");
        var FPS = 30;
        var CALLOUT_START = 0.62;
        var chars = Array.from(FINAL);
        var rows = (function () {
          var a = 20260927 >>> 0;
          function rand() {
            a = (a + 0x6d2b79f5) >>> 0;
            var t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          }
          var glyphs = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
          var firstLock = 3;
          var lastLock = 21;
          var lockAt = chars.map(function (c, i) {
            if (/\s/.test(c)) return 0;
            return Math.round(firstLock + (i / Math.max(1, chars.length - 1)) * (lastLock - firstLock));
          });
          var out = [];
          for (var f = 0; f <= lastLock; f += 1) {
            out.push(
              chars
                .map(function (c, i) {
                  if (/\s/.test(c) || f >= lockAt[i]) return c;
                  var g = glyphs.charAt(Math.floor(rand() * glyphs.length));
                  return g === c ? glyphs.charAt((glyphs.indexOf(g) + 1) % glyphs.length) : g;
                })
                .join("")
            );
          }
          out[out.length - 1] = FINAL;
          return out;
        })();
        live.textContent = rows[0];

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.6): the drawer slides in from the right with the site's
        // open curve (cubic-bezier(0.16,1,0.3,1) ~ expo.out); the page glides aside.
        tl.fromTo(slider, { x: SLOT_W }, { x: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, 0.05);
        tl.fromTo(pageProjects, { x: 0, y: 0 }, { x: DX, y: DY, duration: 0.55, ease: "expo.out", immediateRender: false }, 0.05);
        tl.fromTo(pageOpen, { x: -DX, y: -DY }, { x: 0, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, 0.05);
        tl.fromTo(pageOpen, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut", immediateRender: false }, 0.08);

        // Scene 2 (0.6-1.3): card-morph-anchor. The panel appears pixel-identical
        // over the drawer's crop region, then lifts to the locked pop-out geometry
        // on one tween (uniform scale + radius + ring/shadow); the window dims.
        tl.set(panel, { opacity: 1 }, 0.6);
        tl.fromTo(
          panel,
          { x: PANEL_AT_SLOT.x, y: PANEL_AT_SLOT.y, scale: PANEL_AT_SLOT.scale, borderRadius: 0, boxShadow: RING_OFF },
          { x: 0, y: 0, scale: 1, borderRadius: 15, boxShadow: RING_ON, duration: 0.7, ease: "power2.inOut", immediateRender: false },
          0.6
        );
        tl.fromTo(dim, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 0.6);

        // Callout: scramble-reveal (slide from the left, glyphs lock left to right).
        tl.fromTo(pill, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, CALLOUT_START);
        tl.fromTo(pill, { x: -43.2 }, { x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, CALLOUT_START);
        rows.forEach(function (row, f) {
          tl.set(live, { textContent: row }, CALLOUT_START + f / FPS);
        });

        // Scene 3 (1.3-1.95): submit. The starter chips clear, then the real gold
        // question bubble is unmasked left to right in stepped increments (typed look).
        tl.fromTo(clears, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", immediateRender: false }, 1.3);
        tl.fromTo(
          qLayers,
          { clipPath: qClip(640) },
          { clipPath: qClip(0), duration: 0.6, ease: "steps(26)", immediateRender: false },
          1.36
        );

        // Scene 4 (2.0-3.6): the real answer unmasks top to bottom, one bullet group per step.
        var steps = [
          { from: 505, to: 884, at: 2.0, dur: 0.38 },
          { from: 884, to: 1084, at: 2.44, dur: 0.32 },
          { from: 1084, to: 1286, at: 2.86, dur: 0.32 },
          { from: 1286, to: 1800, at: 3.26, dur: 0.34 },
        ];
        steps.forEach(function (s) {
          tl.fromTo(
            aLayers,
            { clipPath: aClip(s.from) },
            { clipPath: aClip(s.to), duration: s.dur, ease: "power1.inOut", immediateRender: false },
            s.at
          );
        });

        // Scene 5 (3.6-4.15): held read of the full answer.

        // Scene 6 (4.15-4.6): the panel settles back onto the drawer slot (which has
        // mirrored every reveal) and the dim lifts; all done by duration - 0.4 s.
        tl.fromTo(
          panel,
          { x: 0, y: 0, scale: 1, borderRadius: 15, boxShadow: RING_ON },
          {
            x: PANEL_AT_SLOT.x,
            y: PANEL_AT_SLOT.y,
            scale: PANEL_AT_SLOT.scale,
            borderRadius: 0,
            boxShadow: RING_OFF,
            duration: 0.42,
            ease: "power2.inOut",
            immediateRender: false,
          },
          4.15
        );
        tl.fromTo(dim, { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power2.inOut", immediateRender: false }, 4.15);
        tl.set(panel, { opacity: 0 }, 4.57);

        // 4.6-5.0: window static at the handoff state (x 48, y 262, w 984, h 655).
        tl.set({}, {}, 5);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["04-chat"] = tl;
      })();
    </script>
