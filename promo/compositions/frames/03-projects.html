    <style>
      /* Frame 03 · The projects (6 s, 1080x1350).
         Class names carry the "03-projects-" prefix; a CSS class selector cannot

      #root {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: Inter, sans-serif;
        color: #e8edf5;
      }
      #root *,
      #root *::before,
      #root *::after {

      }

      /* Full-bleed ground on its own clip (never on #root). */
      .\30 3-projects-bg {
        position: absolute;
        inset: 0;
        background: #050e1f;
      }
      .\30 3-projects-stage {

      /* ---- Callout slot: one gold pill centred on x 540, box y 162-218 ---- */
      .\30 3-projects-callout-row {

      /* ---- Whip strip (registry whip-pan-cut, scoped to the viewport) ---- */
      .\30 3-projects-strip {

      .\30 3-projects-panel {

      }
      .\30 3-projects-panel-a {

      }
      .\30 3-projects-panel-b {
        left: 984px;
      }
      .\30 3-projects-panel > img {
        position: absolute;
        left: 0;
        top: 0;
        width: 984px;
        height: 615px;
        display: block;
      }
      /* Frame 02's landed content state, composed exactly: 02 scales its outer
         wrapper 1.08 about the viewport centre and translates the inner one
         y -8 px, so the net image transform is translateY(-8 * 1.08) scale(1.08). */
      .\30 3-projects-hero-img {
        transform: translateY(-8.64px) scale(1.08);
        transform-origin: 50% 50%;
      }
      .\30 3-projects-seam {
        position: absolute;
        top: 0;
        left: 984px;
        width: 2px;
        height: 615px;
        margin-left: -1px;
        background: #ffc72c;
        z-index: 3;
      }
    </style>

    <div data-hf-id="hf-8uj6" id="03-projects-bg" class="03-projects-bg clip" data-start="0" data-duration="6" data-track-index="0"></div>

    <div data-hf-id="hf-niph" id="03-projects-stage" class="03-projects-stage clip" data-start="0" data-duration="6" data-track-index="1">

      <!-- Browser window: x 48, y 262, w 984, h 655 — never moves in this frame. -->

            <div data-hf-id="hf-frvs" id="03-projects-tag-1" class="03-projects-tag" data-fact="project" data-text="SandeepCloud">SandeepCloud</div>
            <div data-hf-id="hf-eaqh" id="03-projects-tag-2" class="03-projects-tag" data-fact="project" data-text="ShiftSentry">ShiftSentry</div>
            <div data-hf-id="hf-gp12" id="03-projects-tag-3" class="03-projects-tag" data-fact="project" data-text="Private RAG Search Engine">Private RAG Search Engine</div>

          <!-- Whip strip: hero (A) out to the left, projects-view (B) in from the right. -->

              <img data-hf-id="hf-t1og" class="03-projects-hero-img" src="assets/states/hero.png" alt="Live hero">
            </div>
            <div data-hf-id="hf-nrq5" class="03-projects-panel 03-projects-panel-b">
              <img data-hf-id="hf-2gdn" src="assets/states/projects-view.png" alt="Projects section in view">

            <div data-hf-id="hf-czoj" id="03-projects-seam" class="03-projects-seam" aria-hidden="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var COMP_ID = "03-projects";
        var DURATION = 6;

        // ---- BEAT SYNC: the three punch-ins. The orchestrator retimes these
        // onto the music's beats; every other camera/glow/tag time derives from them.
        var PUNCH_1 = 1.8; // SandeepCloud
        var PUNCH_2 = 3.0; // ShiftSentry
        var PUNCH_3 = 4.2; // Private RAG Search Engine
        var PUNCHES = [PUNCH_1, PUNCH_2, PUNCH_3];

        // ---- Scene 1: in-viewport whip (registry whip-pan-cut, 0.35 s) ----
        var WHIP_AT = 0.04;
        var WHIP_DUR = 0.35;
        var WHIP_END = WHIP_AT + WHIP_DUR;
        var PEAK_BLUR = 16; // px, horizontal only, peaks at mid-whip

        // ---- Scene 2: callout scramble ----
        var CALLOUT_AT = 0.5;
        var CALLOUT_ARRIVE = 0.42;
        var CALLOUT_RESOLVE = 0.62;
        var FPS = 30;
        // Read from the audited attribute so the scramble always ends on data-text.
        var CALLOUT_TEXT = document.getElementById("03-projects-callout").getAttribute("data-text");

        // ---- Scene 3/4: camera ----
        var SCENE3_AT = 1.2;
        var PUNCH_SCALE = 1.24; // <= 1.3; headroom: 0.88 * 984 / 699.4 card width = 1.238
        var PUNCH_DUR = 0.7; // expo.out
        var PAN_DUR = 0.55; // power2.inOut, lands exactly on the next punch
        var MIN_DWELL = 0.5; // after a punch before the camera travels on
        var SETTLE_END = DURATION - 0.45; // every move finished by 5.55 s (trim-safe)
        var RELEASE_AT = Math.min(Math.max(PUNCH_3 + 0.6, SETTLE_END - 0.55), SETTLE_END - 0.3);
        var RELEASE_DUR = SETTLE_END - RELEASE_AT;

        // ---- Geometry (measured from assets/states/projects-full.png, 2880x7706) ----
        var VW = 984;
        var VH = 615;
        var K = VW / 2880; // capture px -> world px (= 0.6833 CSS scale of the 2x capture)
        // Card borders in capture px (left/right edge at x 416/2463; top/bottom hairlines).
        var CARDS = [
          { x0: 416, x1: 2463, y0: 634, y1: 1553 }, // SandeepCloud
          { x0: 416, x1: 2463, y0: 1602, y1: 2659 }, // ShiftSentry
          { x0: 416, x1: 2463, y0: 2708, y1: 3627 }, // Private RAG Search Engine
        ].map(function (c) {
          var l = c.x0 * K,
            r = c.x1 * K,
            t = c.y0 * K,
            b = c.y1 * K;
          return { l: l, t: t, w: r - l, h: b - t, cx: (l + r) / 2, cy: (t + b) / 2 };
        });

        var world = document.getElementById("03-projects-world");
        var strip = document.getElementById("03-projects-strip");
        var seam = document.getElementById("03-projects-seam");
        var blurNode = document.getElementById("03-projects-whip-blur-node");
        var pill = document.getElementById("03-projects-callout");
        var pillLive = document.getElementById("03-projects-callout-live");
        var glows = [1, 2, 3].map(function (i) {
          return document.getElementById("03-projects-glow-" + i);
        });
        var tags = [1, 2, 3].map(function (i) {
          return document.getElementById("03-projects-tag-" + i);
        });

        // Place glows and tags on their cards (world space, so they ride the camera).
        CARDS.forEach(function (c, i) {
          var g = glows[i];
          g.style.left = (c.l - 1.5).toFixed(2) + "px";
          g.style.top = (c.t - 1.5).toFixed(2) + "px";
          g.style.width = (c.w + 3).toFixed(2) + "px";
          g.style.height = (c.h + 3).toFixed(2) + "px";
          var tg = tags[i];
          tg.style.left = (c.l + 22).toFixed(2) + "px";
          tg.style.top = (c.t - 31).toFixed(2) + "px";
        });

        // ---- Virtual camera (viewport-change): ONE .world wrapper carries the camera.
        // A camera pose is { s, fx, fy }: zoom s with world point (fx, fy) held at the
        // viewport centre. With transform-origin 0 0 the wrapper's translate is
        // T = centre - s * focal (the T = -offset x S law, measured from the world
        // origin). GSAP writes x / y / scale on the wrapper directly (no onUpdate
        // writer: seek() suppresses callbacks, so a callback-driven camera would not
        // follow a seek). For a punch the focal is fixed, so T is affine in s and
        // sharing one ease keeps the card dead-centre through the whole zoom.
        function pose(c) {
          return { x: VW / 2 - c.s * c.fx, y: VH / 2 - c.s * c.fy, scale: c.s };
        }
        var HOME = { s: 1, fx: VW / 2, fy: VH / 2 }; // == projects-view plate (scroll 0)
        function station(i, s) {
          return { s: s, fx: CARDS[i].cx, fy: CARDS[i].cy };
        }
        gsap.set(world, Object.assign({ transformOrigin: "0 0" }, pose(HOME)));

        var tl = gsap.timeline({ paused: true });

        function camMove(from, to, dur, ease, at) {
          var t = pose(to);
          tl.fromTo(
            world,
            pose(from),
            { x: t.x, y: t.y, scale: t.scale, duration: dur, ease: ease, immediateRender: false },
            at,
          );
        }

        // ---- Explicit initial states (seek-safe) ----
        gsap.set(strip, { x: 0, autoAlpha: 1 });
        gsap.set(seam, { autoAlpha: 0 });
        gsap.set(pill, { autoAlpha: 0, x: -48 });
        gsap.set(glows, { autoAlpha: 0, scale: 1 });
        gsap.set(tags, { autoAlpha: 0, x: 0 });

        // ================= Scene 1 (0.0-0.5): whip inside the viewport =================
        // Directional motion blur (horizontal only), peaking at mid-whip = peak velocity.
        blurNode.setAttribute("stdDeviation", "0 0");

        tl.fromTo(
          strip,
          { x: 0 },
          { x: -VW, duration: WHIP_DUR, ease: "power3.inOut", immediateRender: false },
          WHIP_AT,
        );
        tl.fromTo(
          blurNode,
          { attr: { stdDeviation: "0 0" } },
          { attr: { stdDeviation: PEAK_BLUR + " 0" }, duration: WHIP_DUR / 2, ease: "power3.in", immediateRender: false },
          WHIP_AT,
        );
        tl.fromTo(
          blurNode,
          { attr: { stdDeviation: PEAK_BLUR + " 0" } },
          { attr: { stdDeviation: "0 0" }, duration: WHIP_DUR / 2, ease: "power3.out", immediateRender: false },
          WHIP_AT + WHIP_DUR / 2,
        );
        tl.fromTo(
          seam,
          { autoAlpha: 0 },
          { autoAlpha: 0.85, duration: 0.06, ease: "power1.out", immediateRender: false },
          WHIP_AT,
        );
        tl.fromTo(
          seam,
          { autoAlpha: 0.85 },
          { autoAlpha: 0, duration: 0.1, ease: "power1.in", immediateRender: false },
          WHIP_END - 0.1,
        );
        // Landed on projects-view, which is pixel-identical to the top of
        // projects-full: drop the strip and the world (camera at HOME) carries on.
        tl.set(strip, { autoAlpha: 0 }, WHIP_END + 0.01);

        // ================= Scene 2 (0.5-1.2): "7 shipped projects" scrambles in =================
        var frameTable = (function () {
          // mulberry32, seed 20260927 (video direction's shared seed).
          var a = 20260927;
          function rand() {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          }
          var glyphs = "abcdefghijklmnopqrstuvwxyz0123456789";
          var chars = Array.from(CALLOUT_TEXT);
          var last = Math.max(1, Math.round(CALLOUT_RESOLVE * FPS));
          var first = Math.max(1, Math.round(0.12 * FPS));
          var lockAt = chars.map(function (ch, i) {
            if (/\s/.test(ch)) return 0;
            var p = chars.length <= 1 ? 1 : i / (chars.length - 1);
            return Math.round(first + p * (last - first));
          });
          var rows = [];
          for (var f = 0; f <= last; f += 1) {
            rows.push(
              chars
                .map(function (ch, i) {
                  if (/\s/.test(ch) || f >= lockAt[i]) return ch;
                  var g = glyphs.charAt(Math.floor(rand() * glyphs.length));
                  return g === ch ? glyphs.charAt((glyphs.indexOf(g) + 1) % glyphs.length) : g;
                })
                .join(""),
            );
          }
          rows[rows.length - 1] = CALLOUT_TEXT;
          return rows;
        })();
        pillLive.textContent = frameTable[0];

        tl.fromTo(
          pill,
          { autoAlpha: 0, x: -48 },
          { autoAlpha: 1, x: 0, duration: CALLOUT_ARRIVE, ease: "power3.out", immediateRender: false },
          CALLOUT_AT,
        );
        frameTable.forEach(function (row, f) {
          tl.set(pillLive, { textContent: row }, CALLOUT_AT + f / FPS);
        });
        // The callout holds across the pan (no exit).

        // ================= Scene 3 (1.2-5.2): pan down, three beat punch-ins =================
        var panStart = [];
        var panDur = [];
        PUNCHES.forEach(function (p, i) {
          var earliest = i === 0 ? SCENE3_AT : PUNCHES[i - 1] + MIN_DWELL;
          var s = Math.min(Math.max(earliest, p - PAN_DUR), p - 0.2);
          panStart.push(s);
          panDur.push(p - s);
        });

        var prev = HOME;
        PUNCHES.forEach(function (p, i) {
          // Travel (pan) to the next card at 1.0x, arriving exactly on the beat.
          camMove(prev, station(i, 1), panDur[i], "power2.inOut", panStart[i]);
          // Punch in on the beat (expo.out), scale about the card centre.
          var nextAnchor = i < PUNCHES.length - 1 ? panStart[i + 1] : RELEASE_AT;
          var pDur = Math.max(0.2, Math.min(PUNCH_DUR, nextAnchor - p));
          camMove(station(i, 1), station(i, PUNCH_SCALE), pDur, "expo.out", p);
          prev = station(i, PUNCH_SCALE);

          // Brief gold glow on the card.
          tl.fromTo(
            glows[i],
            { autoAlpha: 0, scale: 1.03 },
            { autoAlpha: 1, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false },
            p,
          );
          // Gold name tag.
          tl.fromTo(
            tags[i],
            { autoAlpha: 0, x: -16 },
            { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false },
            p + 0.06,
          );
        });

        // Glows 1 and 2 are brief: they fade as the camera travels to the next card.
        [0, 1].forEach(function (i) {
          tl.fromTo(
            glows[i],
            { autoAlpha: 1 },
            { autoAlpha: 0, duration: panDur[i + 1] * 0.7, ease: "power2.in", immediateRender: false },
            panStart[i + 1],
          );
        });

        // ================= Scene 4 (5.2-6.0): ease back to 1.0x on card 3, still =================
        camMove(prev, station(2, 1), RELEASE_DUR, "power2.inOut", RELEASE_AT);
        tl.fromTo(
          glows[2],
          { autoAlpha: 1 },
          { autoAlpha: 0.5, duration: RELEASE_DUR, ease: "power2.inOut", immediateRender: false },
          RELEASE_AT,
        );
        // From SETTLE_END (5.55 s) to 6.0 s nothing moves: window and view at the handoff state.

        tl.seek(0);

        window.__timelines = window.__timelines || {};
        window.__timelines[COMP_ID] = tl;
      })();
    </script>
  </div>
</template>
